# Per-title executable overrides for EA games.
#
# Some EA titles ship an Origin *launcher wrapper* that maxima runs by default
# (it's the executable listed in the offer manifest). That wrapper then tries to
# start the real game via a link2ea:// protocol hand-off — a Windows-only path
# that isn't wired under our Linux Wine bottle, so the sub-game dies with
# "Origin Authorization failed".
#
# The fix: point maxima straight at the real game exe with --game-path, so it
# launches directly and authenticates against LSX like any normal direct-launch
# title (the same working path Mirror's Edge Catalyst / Battlefield 4 use — no
# launcher, no hand-off).
#
# Format (one game per line):
#     <slug>=<executable path relative to the install dir>
#
# The <slug> is the game's ea.py ShortName. Lines starting with # are comments.
# The path is resolved against the game's install dir; if the file doesn't exist
# the override is ignored and maxima falls back to the manifest exe.

# C&C Remastered Collection: ClientLauncherG.exe (EA launcher) -> ClientG.exe is
# the actual game (loads TiberianDawn.dll / RedAlert.dll).
command-and-conquer-remastered=ClientG.exe
